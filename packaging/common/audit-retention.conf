# Audit retention for the API audit trail (hc-audit-retention, daily timer).
# Owned by root, mode 0640, group homelab-control: the service reads it but
# cannot change it. Values may be shortened, never raised above the owner
# maxima; the worker refuses anything outside the limits.
# See docs/security/AUDIT-LOG.md ("Retention").
#
# Unset keys use the defaults shown (the owner maxima).

# Days a record stays in the live database (shown on the Audit page). 1..365.
#active_retention_days = 365

# Total retention from event time, in calendar months. Archives whose newest
# record is older are deleted. 1..60. Must cover the live window.
# Shortening it needs one manual confirmation:
#   runuser -u homelab-control -- hc-audit-retention run --dry-run
#   runuser -u homelab-control -- hc-audit-retention run --confirm
#archive_retention_months = 60

# When the database pages in use exceed this size (GiB), the oldest records
# are archived early. 1..1024.
#active_db_threshold_gib = 5
