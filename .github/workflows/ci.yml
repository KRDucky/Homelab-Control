name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual full run (Actions tab -> ci -> Run workflow): same jobs and matrix as push/PR, no inputs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by full commit SHA (ADR 0006); the comment names the tag. All are official
# actions/* releases on the node24 runtime (the node20 versions are deprecated by GitHub).
# No job pushes to git, so checkouts do not persist credentials.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must be a supported Go release line: govulncheck gates on stdlib advisories,
          # and EOL lines (1.24 since Feb 2026) no longer receive stdlib security fixes.
          # go.mod's `go 1.24` stays as the minimum language version.
          # Exact version, equal to GO_VERSION in packaging/release/toolchain.env (the release toolchain;
          # tests/release/test_workflow_policy.py checks they match). 1.26.11 fixes GO-2026-6859.
          go-version: '1.26.11'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No dependency cache: builds must come from the lockfile, never from a restored cache
          # (the release dry run in particular).
          package-manager-cache: false
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck lintian musl-tools
          # Rust for hc-audit-retention (ADR 0006 amendment 4): exact RUST_VERSION from toolchain.env via the
          # runner's rustup (no installer script); musl-gcc compiles the bundled SQLite for the static binary.
          RUST_VERSION=$(sed -n 's/^RUST_VERSION=//p' packaging/release/toolchain.env)
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt -c clippy -t x86_64-unknown-linux-musl
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0  # pinned (commit e672cbe8); needs Go >= 1.26.0
          python3 -m venv /tmp/spdx && /tmp/spdx/bin/pip install -q spdx-tools==0.8.3 reuse==6.2.0  # SBOM + REUSE validation (CI-only tools)
          echo /tmp/spdx/bin >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint (installs frontend deps without scripts)
        run: make lint
      - name: Build (embeds UI)
        run: make build
      - name: Go tests (non-root runner)
        run: make test-go
      - name: Rust tests (hc-audit-retention, incl. Go golden digest vectors)
        run: make test-rust
      - name: Cross-language retention check (Go records, Rust archive/prune, Go verify)
        run: make test-retention-xcheck
      - name: Fuzz broker argument decoding (60 s)
        run: cd backend && go test -run='^$' -fuzz='^FuzzLogsArgs$' -fuzztime=60s ./internal/broker/ops
      - name: Fuzz write-operation argument decoding (60 s)
        run: cd backend && go test -run='^$' -fuzz='^FuzzWriteArgs$' -fuzztime=60s ./internal/broker/ops
      - name: Frontend tests
        run: make test-frontend
      - name: Release tooling + workflow policy tests
        run: make test-release
      - name: Security gate
        run: make security
      - name: Reproducible build check
        run: make repro-check
      - name: Packages (deb)
        run: make deb
      - name: Release payload compliance (deb)
        run: |
          for p in build/*.deb; do scripts/package-inventory.sh "$p" "$p.inventory.txt"; done
          # Debian copyright/licence tags only; other lintian findings are tracked separately (dev package).
          for p in build/*.deb; do
            lintian --tag-display-limit 0 "$p" | tee "$p.lintian.txt" || true
            if grep -iE 'copyright|licen[cs]e|dep-?5' "$p.lintian.txt"; then echo "::error::lintian copyright/licence findings in $p"; exit 1; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build/hc-api
            build/hc-broker
            build/hc-audit-retention
            build/hc-storage-probe
            build/hc-mergerfs-apply
            build/hc-apt-apply
            build/hlctl
            build/SHA256SUMS
            build/*.deb
            build/*.inventory.txt
            build/*.lintian.txt

  # LA-13 / ADR 0009: the complete release pipeline as a dry run on every PR and push, with the exact
  # release toolchain (packaging/release/toolchain.env): corresponding-source archive (with the npm
  # sources of everything compiled in), binaries and the Debian/Ubuntu .deb built only from that
  # archive and matched against a git build, two independent runs compared byte for byte, then the
  # assembled candidate verified (SBOM, notices, checksums, no Webmin, package payload) with
  # negative tests. Same reusable workflow as release.yml; here it is read-only and publishes nothing.
  # Fedora, openSUSE and Arch are not part of the first release. Their packaging scripts stay in the tree.
  release-dry-run:
    needs: check
    uses: ./.github/workflows/release-build.yml
    with:
      mode: dry-run
      commit: ${{ github.sha }}

  # Install/run/remove the .deb (no systemd as PID 1: the broker and API are started by
  # hand; services must report "unsupported"). First release: Debian and Ubuntu only.
  # openSUSE used the Fedora rpm, so it leaves this matrix with Fedora and Arch.
  install-matrix:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:stable', prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'debian:oldstable', prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:24.04', prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:26.04', prep: 'apt-get update && apt-get install -y curl' }
          - { image: 'ubuntu:22.04', prep: 'apt-get update && apt-get install -y curl' }
    container: ${{ matrix.image }}
    steps:
      - name: Prepare
        run: ${{ matrix.prep }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Named downloads only: other jobs' artifacts (e.g. release-dry-run's packages) must not be
      # picked up by the globs below.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: artifacts
      - name: Install test
        run: |
          touch /etc/hc-disposable
          pkg=$(ls artifacts/*.deb)
          HC_DISTRO="${{ matrix.image }}" tests/packaging/install-test.sh "$pkg"

  # Real systemd: the GitHub runner VM boots systemd as PID 1 and is discarded after the job.
  systemd-ubuntu:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Package + hardened units under systemd (incl. real upstream Webmin)
        run: |
          sudo touch /etc/hc-disposable
          sudo env HC_SMOKE_EXTRA_UNITS=homelab-control-broker.socket \
            HC_SMOKE_EXTRA_CHECKS="$PWD/tests/systemd/m1-checks.sh $PWD/tests/systemd/m2-service-ops.sh $PWD/tests/systemd/m2-3-checks.sh" \
            HC_WEBMIN_SRC="$PWD/compat/webmin" \
            HC_SMOKE_SCOPES=system.read,services.read,services.logs,hardware.read \
            HC_SMOKE_RATE_LIMIT_BURST=100000 \
            tests/systemd/systemd-smoke.sh "$(ls build/*.deb)"

  # Ubuntu 26.04 LTS under real systemd (newer systemd than the 24.04 runner).
  # Disposable debootstrapped container with systemd as PID 1, on the throwaway runner VM.
  systemd-ubuntu-2604:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Package + hardened units under systemd on 26.04 (resolute)
        run: |
          sudo apt-get update && sudo apt-get install -y debootstrap
          set -o pipefail
          if ! sudo dev/disposable/systemd-container.sh resolute "$(ls build/*.deb)" \
            HC_SMOKE_EXTRA_UNITS=homelab-control-broker.socket "HC_SMOKE_EXTRA_CHECKS=/opt/hc/tests/m1-checks.sh /opt/hc/tests/m2-service-ops.sh /opt/hc/tests/m2-3-checks.sh" \
            HC_WEBMIN_SRC=/opt/hc/webmin HC_SMOKE_SCOPES=system.read,services.read,services.logs,hardware.read \
            HC_SMOKE_RATE_LIMIT_BURST=100000 2>&1 | tee /tmp/sd.log; then
            echo "::error title=systemd-ubuntu-2604::$(grep -E 'FAIL|rror|E: |unsupported|denied|systemd|cgroup|Failed' /tmp/sd.log | tail -n 25 | sed ':a;N;$!ba;s/\n/%0A/g')%0A--- tail ---%0A$(tail -n 15 /tmp/sd.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  # Upgrade from the published v0.1.0-dev.1 .deb to this build (state database, sessions, D-7 scopes).
  upgrade-ubuntu:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Upgrade v0.1.0-dev.1 -> this build under systemd
        run: |
          curl -fsSL -o /tmp/old.deb \
            https://github.com/KRDucky/Homelab-Control---Webmin-Fork/releases/download/v0.1.0-dev.1/homelab-control_0.1.0-dev.1_amd64.deb
          sudo touch /etc/hc-disposable
          sudo tests/packaging/upgrade-test.sh /tmp/old.deb "$(ls build/*.deb)"

  browser-e2e:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Accessibility test dependency
        run: cd frontend/app && npm ci --ignore-scripts --no-fund
      - name: Playwright
        run: |
          pip install playwright==1.63.0  # >= 1.61 needed for Ubuntu 26.04; same pin as dev/vm/guest-validate.sh
          python -m playwright install --with-deps chromium firefox webkit
      - name: API security checks + browser e2e (unprivileged)
        env:
          HC_CSP_BROWSERS: chromium,firefox,webkit
        run: |
          chmod +x build/hc-api build/hlctl
          tests/integration/run-hc-e2e.sh

  upstream-perl-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upstream Webmin test suite (pinned baseline)
        working-directory: compat/webmin
        run: |
          sudo apt-get update && sudo apt-get install -y libperl-critic-perl
          prove -lr t
