openapi: 3.1.0
info:
  title: Homelab Control API
  version: 1.1.0-m1
  description: >
    Versioned management API. M0 exposes authentication and a read-only host overview only.
    All non-GET requests require an Origin header matching the server and the session's
    X-CSRF-Token. Every endpoint except /health and /auth/login requires a session cookie.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-hc_session
      description: "Named hc_session (no Secure flag) only in loopback dev-insecure-http mode."
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, examples: [unauthenticated, forbidden, csrf_rejected, origin_rejected, throttled] }
        message: { type: string }
    Session:
      type: object
      required: [username, scopes, csrf_token, version]
      properties:
        username: { type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$' }
        scopes: { type: [array, "null"], items: { type: string, enum: [system.read, services.read, hardware.read, services.logs, audit.read, services.operate] } }
        csrf_token: { type: string }
        version: { type: string }
        legacy_url: { type: string }
        step_up_until: { type: string, format: date-time, description: 'When the password re-entry of this session (D-3) lapses; absent when there is none' }
    Meta:
      type: object
      required: [status, sources]
      properties:
        status: { type: string, enum: [ok, partial, unavailable] }
        sources: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
    Overview:
      type: object
      required: [collected_at, system, cpu, memory, filesystems, network, legacy_webmin]
      properties:
        collected_at: { type: string, format: date-time }
        system:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                hostname: { type: string }
                kernel: { type: string }
                os:
                  type: object
                  properties:
                    id: { type: string }
                    id_like: { type: string }
                    name: { type: string }
                    pretty_name: { type: string }
                    version_id: { type: string }
                distro_family: { type: string, enum: [debian, fedora, suse, arch, unknown] }
                uptime_seconds: { type: number }
                load_average: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        cpu:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                model: { type: string }
                logical_cpus: { type: integer }
                usage_percent: { type: number, description: Omitted when it could not be sampled }
                sample_millis: { type: integer }
        memory:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                total_bytes: { type: integer }
                available_bytes: { type: integer }
                used_bytes: { type: integer }
                swap_total_bytes: { type: integer }
                swap_free_bytes: { type: integer }
        filesystems:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                view:
                  type: string
                  enum: [host, service]
                  description: "host = the host's mount table (/proc/1/mounts); service = only hc-api's sandboxed view was readable, so read_only is never set and note explains."
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [kernel_source, mount_point, fs_type, read_only, probed]
                    properties:
                      kernel_source: { type: string, description: "Kernel-reported source. /dev/sdX names are volatile and are not a drive identity." }
                      mount_point: { type: string }
                      fs_type: { type: string }
                      read_only: { type: boolean, description: "Read-only on the host. Always false in the service view, where the sandbox makes every mount look read-only." }
                      probed: { type: boolean }
                      skip_reason: { type: string }
                      total_bytes: { type: integer }
                      used_bytes: { type: integer }
                      avail_bytes: { type: integer }
        network:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                interfaces:
                  type: array
                  items:
                    type: object
                    required: [name, physical, rx_bytes, tx_bytes]
                    properties:
                      name: { type: string }
                      oper_state: { type: string }
                      mac: { type: string }
                      mtu: { type: integer }
                      physical: { type: boolean }
                      speed_mbps: { type: integer }
                      rx_bytes: { type: integer }
                      tx_bytes: { type: integer }
                      addresses: { type: array, items: { type: string } }
        legacy_webmin:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                installed: { type: boolean }
                version: { type: string }
                config_readable: { type: boolean }
                configured_url: { type: string }
                privilege_needed: { type: string }
    Capability:
      type: object
      required: [id, label, path, scope, status]
      properties:
        id: { type: string, enum: [overview, services, hardware, legacy] }
        label: { type: string }
        path: { type: string }
        scope: { type: string }
        status: { type: string, enum: [available, degraded, unavailable, unsupported, forbidden] }
        reason: { type: string }
    Capabilities:
      type: object
      required: [broker, capabilities]
      properties:
        broker:
          type: object
          properties:
            status: { type: string, enum: [available, unavailable] }
            version: { type: string }
            reason: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    UnitList:
      type: object
      required: [units, counts, truncated, source]
      properties:
        systemd_version: { type: string }
        truncated: { type: boolean }
        source: { type: string }
        counts: { type: object, additionalProperties: { type: integer } }
        units:
          type: array
          items:
            type: object
            required: [name, type, load, active, sub, description]
            properties:
              name: { type: string, pattern: '^[A-Za-z0-9:_.\\@-]{1,256}$' }
              type: { type: string }
              load: { type: string }
              active: { type: string }
              sub: { type: string }
              description: { type: string, maxLength: 256 }
              unit_file_state: { type: string }
              preset: { type: string }
        protected:
          type: object
          description: .service units the built-in policy (D-5) protects, keyed by unit name. Labels for the UI only; the broker enforces the policy.
          additionalProperties: { $ref: '#/components/schemas/Protection' }
        operate:
          type: object
          required: [available]
          properties:
            available: { type: boolean, description: 'Whether start/stop/restart can be offered to this caller' }
            reason: { type: string }
    Protection:
      type: object
      required: [protected]
      properties:
        protected: { type: boolean }
        category: { type: string, enum: [self, remote, ipc, systemd, console, session, network, firewall, remoteaccess, display, storage, security, power, identity] }
        reason: { type: string }
        matched: { type: string }
    UnitObserved:
      type: object
      required: [id, load_state, active_state, sub_state]
      properties:
        id: { type: string }
        names: { type: array, items: { type: string } }
        description: { type: string }
        load_state: { type: string }
        active_state: { type: string }
        sub_state: { type: string }
        result: { type: string }
        unit_file_state: { type: string }
        main_pid: { type: integer }
        exec_main_status: { type: integer }
        invocation_id: { type: string }
        type: { type: string }
        state_since: { type: string }
    ServicePlan:
      type: object
      required: [unit, requested, action, risk, step_up_required, token, expires_at, observed, effect, consequences]
      properties:
        unit: { type: string, description: Canonical unit ID (aliases are resolved by the broker) }
        requested: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        risk: { type: string, enum: [reversible, disruptive] }
        step_up_required: { type: boolean }
        token: { type: string, description: 'Single-use plan token, valid 120 s, bound to this session, user, action, unit and the observed state. Not a credential on its own.' }
        expires_at: { type: string, format: date-time }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        effect: { type: string }
        consequences: { type: array, items: { type: string } }
        also_affected: { type: array, items: { type: string }, description: 'Running units systemd stops or restarts together with this one (found by a bounded, transitive walk of the dependency graph), or that a start stops because of Conflicts=' }
        also_started: { type: array, items: { type: string }, description: Other currently inactive units that a start pulls in (transitively) }
    ServiceOutcome:
      type: object
      required: [operation_id, unit, action, outcome, message, started_at, finished_at]
      properties:
        operation_id: { type: string }
        unit: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        outcome: { type: string, enum: [succeeded, failed, uncertain], description: 'succeeded/failed are verified by reading the unit state back; uncertain means it could not be verified' }
        message: { type: string }
        exit_code: { type: integer }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        recovery: { type: array, items: { type: string }, description: Recovery guidance when the outcome is not succeeded. No rollback is performed. }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    OperationList:
      type: object
      required: [operations, source]
      properties:
        source: { type: string }
        operations:
          type: array
          items:
            type: object
            required: [id, op, action, unit, actor, risk, outcome, started_at]
            properties:
              id: { type: string }
              op: { type: string }
              action: { type: string }
              unit: { type: string }
              actor: { type: string }
              request_id: { type: string }
              risk: { type: string }
              outcome: { type: string, enum: [succeeded, failed, uncertain, interrupted, pending] }
              message: { type: string }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
              observed: { $ref: '#/components/schemas/UnitObserved' }
    SessionList:
      type: object
      required: [persistent, idle_timeout_seconds, max_lifetime_seconds, sessions]
      properties:
        persistent: { type: boolean, description: 'false when hc-api runs without the state database (sessions end on restart)' }
        idle_timeout_seconds: { type: integer }
        max_lifetime_seconds: { type: integer }
        sessions:
          type: array
          items:
            type: object
            required: [id, created, last_seen, current]
            properties:
              id: { type: string, description: SHA-256 of the cookie value; cannot be used to sign in }
              created: { type: string, format: date-time }
              last_seen: { type: string, format: date-time, description: 'Refreshed at most every 30 s' }
              remote_ip: { type: string }
              user_agent: { type: string }
              current: { type: boolean }
    AuditPage:
      type: object
      required: [events, source]
      properties:
        next_before: { type: integer }
        source: { type: string }
        events:
          type: array
          items:
            type: object
            required: [id, seq, time, event, outcome, prev, hash]
            properties:
              id: { type: integer }
              seq: { type: integer }
              time: { type: string, format: date-time }
              event: { type: string }
              user: { type: string }
              remote: { type: string }
              outcome: { type: string }
              detail: { type: string }
              prev: { type: string }
              hash: { type: string }
    UnitLogs:
      type: object
      required: [unit, requested, entries, truncated, source]
      properties:
        unit: { type: string }
        requested: { type: integer }
        truncated: { type: boolean, description: Older entries were dropped to stay under 1 MiB }
        skipped: { type: integer, description: Unparseable journal lines }
        source: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [message]
            properties:
              time: { type: string, format: date-time }
              priority: { type: integer, minimum: 0, maximum: 7 }
              pid: { type: integer }
              identifier: { type: string, maxLength: 64 }
              message: { type: string, maxLength: 4096, description: Control characters removed; capped at 4 KiB }
              truncated: { type: boolean }
    Hardware:
      type: object
      required: [inventory, identity]
      description: >
        inventory comes from world-readable sysfs (hc-api); identity (SMBIOS serials/UUID) from the
        broker op hardware.dmi.identity. Disk identity is never the kernel name; identity_confidence is
        high (WWN), medium (serial), low (by-id only) or none.
      properties:
        inventory: { type: object }
        identity:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable] }
            reason: { type: string }
            data: { type: object }
    LegacyWebmin:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [broker, unprivileged] }
        reason: { type: string }
        status:
          type: object
          description: Allow-listed fields only; never hashes, keys or session data.
          properties:
            installed: { type: boolean }
            version: { type: string }
            port: { type: integer }
            tls: { type: boolean }
            bind: { type: string }
            listens_on_all_interfaces: { type: boolean }
            running: { type: boolean }
            user_count: { type: integer }
            rpc_capable_users: { type: array, items: { type: string } }
            checks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  level: { type: string, enum: [ok, warn, info] }
                  message: { type: string }
        fallback: { type: object }
paths:
  /health:
    get:
      summary: Liveness (public, no host data)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok }, api: { const: v1 } } } } } }
  /auth/login:
    post:
      summary: Create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { description: Session created; cookie set, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Malformed body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not JSON, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Throttled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      summary: Destroy the current session
      security: [{ session: [], csrf: [] }]
      responses:
        '204': { description: Logged out }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin or CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/session:
    get:
      summary: Current session and CSRF token
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/sessions:
    get:
      summary: The caller's own sessions (persistent with the state database)
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionList' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: The state database could not be read, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/sessions/{id}/revoke:
    post:
      summary: End one of the caller's own sessions (requires Origin and X-CSRF-Token)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'Session id from GET /auth/sessions (SHA-256 of the cookie value)' }
      responses:
        '204': { description: 'Revoked; when it was the current session the cookie is cleared' }
        '400': { description: Malformed id, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin or CSRF check failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'No such session for this user (other users'' sessions are never affected)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /audit:
    get:
      summary: API audit trail, newest first (scope audit.read)
      security: [{ session: [] }]
      x-required-scope: audit.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: 'Return records with id below this (paging cursor: next_before)' }
        - { name: event, in: query, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }, description: 'Event name prefix, e.g. auth.' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { description: Invalid query, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: No state database, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/overview:
    get:
      summary: Read-only host overview (scope system.read)
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /capabilities:
    get:
      summary: What this server can show this user right now (drives navigation)
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Capabilities' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services:
    get:
      summary: systemd units (read-only, via broker op services.systemd.list)
      security: [{ session: [] }]
      x-required-scope: services.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'Broker failure (details are not exposed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable or systemd not running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '504': { description: 'Broker operation timed out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/logs:
    get:
      summary: Recent journal entries of one listed unit (read-only, via broker op services.unit.logs). Reads are audited; content is not stored.
      security: [{ session: [] }]
      x-required-scope: services.logs
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.(service|socket|timer|mount|automount|path|target|swap)$' } }
        - { name: lines, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/UnitLogs' } } } }
        '400': { description: 'Invalid unit name or line count', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'The unit is not listed by systemd', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'Broker failure (details are not exposed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable; systemd/journald or the journal reader group missing; or the read could not be audited (audit_unavailable, no content returned)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '504': { description: 'Broker operation timed out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/plan:
    post:
      summary: 'Review start, stop or restart of one .service unit (broker op services.unit.plan): policy check, observed state, risk class and a single-use plan token. Nothing is changed.'
      security: [{ session: [] }]
      x-required-scope: services.operate
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action], properties: { action: { type: string, enum: [start, stop, restart] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServicePlan' } } } }
        '400': { description: Invalid unit, action or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, or policy_denied (protected unit, alias or dependency; RefuseManualStart/Stop)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: systemd does not know the unit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'busy: another operation on the unit is in progress', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker or systemd unavailable, operation journal unavailable, or the review could not be audited (no token issued)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/apply:
    post:
      summary: 'Execute a reviewed operation with its plan token (broker op services.unit.apply). Stop and restart need a password re-entry within 5 minutes (step_up_required). The result is verified by reading the unit state back; there is no rollback.'
      security: [{ session: [] }]
      x-required-scope: services.operate
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action, token], properties: { action: { type: string, enum: [start, stop, restart] }, token: { type: string, maxLength: 2048 } } } } }
      responses:
        '200': { description: 'Executed; the outcome (succeeded, failed or uncertain) is the observed one', content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOutcome' } } } }
        '400': { description: Invalid unit, action, token or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, step_up_required, or policy_denied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'plan_invalid (expired, used or not bound to this request), conflict (the unit changed since the review; nothing done) or busy', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'outcome_unknown: the broker returned no result (connection lost or timed out); the operation may or may not have run', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable, the journal could not be written (nothing executed) or the request could not be audited (nothing executed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/step-up:
    post:
      summary: 'Re-enter the password of the signed-in user (D-3). Valid 5 minutes for this session only; failures count toward login throttling. The password never reaches the broker or the audit log.'
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [password], properties: { password: { type: string, maxLength: 1024 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [step_up_until], properties: { step_up_until: { type: string, format: date-time } } } } } }
        '403': { description: 'invalid_credentials, or CSRF/Origin rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Throttled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /operations:
    get:
      summary: 'The 100 most recent privileged operations from the broker operation journal (op operations.journal.list), newest first, including interrupted ones'
      security: [{ session: [] }]
      x-required-scope: audit.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OperationList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker or operation journal unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hardware:
    get:
      summary: Hardware inventory (read-only). Degrades instead of failing when the broker is down.
      security: [{ session: [] }]
      x-required-scope: hardware.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Hardware' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /legacy/webmin:
    get:
      summary: Upstream Webmin status and security review (broker), or unprivileged fallback
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyWebmin' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
