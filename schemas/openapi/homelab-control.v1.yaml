openapi: 3.1.0
info:
  title: Homelab Control API
  version: 1.1.0-m1
  description: >
    Versioned management API. M0 exposes authentication and a read-only host overview only.
    All non-GET requests require an Origin header matching the server and the session's
    X-CSRF-Token. Every endpoint except /health, /auth/login and /auth/oidc* requires a session cookie.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-hc_session
      description: "Named hc_session (no Secure flag) only in loopback dev-insecure-http mode."
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    ContainerIdentitySettings:
      type: object
      additionalProperties: false
      description: One configuration layer. Absent fields are not set by this layer; supplementalGroups [] explicitly means no extra groups.
      properties:
        uid: { type: integer, minimum: 0, maximum: 4294967294 }
        gid: { type: integer, minimum: 0, maximum: 4294967294 }
        umask: { type: string, pattern: '^0?[0-7]{3}$' }
        supplementalGroups: { type: array, maxItems: 32, items: { type: integer, minimum: 0, maximum: 4294967294 } }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, examples: [unauthenticated, forbidden, csrf_rejected, origin_rejected, throttled] }
        message: { type: string }
    Session:
      type: object
      required: [username, scopes, csrf_token, version]
      properties:
        username: { type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$' }
        scopes: { type: [array, "null"], items: { type: string, enum: [system.read, services.read, hardware.read, services.logs, audit.read, services.operate, services.configure, services.files, storage.read, host.settings.preview, host.settings.apply, layout.manage, files.read, packages.read, networking.proxy.read] } }
        csrf_token: { type: string }
        version: { type: string }
        legacy_url: { type: string }
        step_up_until: { type: string, format: date-time, description: 'When the password re-entry of this session (D-3) lapses; absent when there is none' }
    Meta:
      type: object
      required: [status, sources]
      properties:
        status: { type: string, enum: [ok, partial, unavailable] }
        sources: { type: array, items: { type: string } }
        errors: { type: array, items: { type: string } }
    StorageEvidence:
      type: object
      required: [source, confidence]
      properties:
        source: { type: string }
        confidence: { type: string }
    StorageIdentifier:
      type: object
      required: [kind, value, source, ambiguous]
      properties:
        kind: { type: string }
        value: { type: string }
        source: { type: string }
        ambiguous: { type: boolean }
        scope: { type: string, enum: [device, controller], description: "controller marks an NVMe controller serial shared by its namespaces" }
      description: >-
        Kinds include wwn (NAA/EUI designators only), nvme-uuid, t10-vendor-id and nvme-vendor-id
        (vendor-derived, not world-wide names), wwid-unclassified, serial, controller-serial, partuuid,
        dm-uuid, md-uuid and by-id.
    StorageMDState:
      type: object
      required: [level, members, source]
      description: Raw Linux md sysfs runtime attributes; never summarized as healthy.
      properties:
        level: { type: string }
        array_state: { type: string }
        raid_disks: { type: integer, minimum: 0 }
        degraded: { type: integer, minimum: 0 }
        sync_action: { type: string }
        sync_completed: { type: string }
        mismatch_count: { type: integer, minimum: 0 }
        source: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              device_number: { type: string, description: Volatile kernel major/minor observation }
              slot: { type: string }
              state: { type: string }
    StorageNode:
      type: object
      required: [id, kind, name, identity_status, evidence]
      properties:
        id: { type: string, description: Snapshot-local node key; not a persistent disk identifier }
        kind: { type: string }
        name: { type: string }
        persistent_id: { type: string }
        identifiers: { type: array, items: { $ref: '#/components/schemas/StorageIdentifier' } }
        identity_status: { type: string, enum: [observed, ambiguous, unavailable, snapshot-local] }
        device_number: { type: string, description: Volatile kernel major/minor observation }
        disk_seq: { type: string, description: "Kernel per-boot disk sequence number (sysfs diskseq; a partition reports its disk's). Detects device-number reuse; not a persistent identity" }
        size_bytes: { type: integer, minimum: 0 }
        filesystem_type: { type: string }
        signature_uuid: { type: string, description: "UUID reported by an observed signature (signature nodes only; for LVM2_member, the PV UUID)" }
        mountpoint: { type: string }
        mount_root: { type: string }
        mount_view: { type: string, enum: [service, host] }
        md: { $ref: '#/components/schemas/StorageMDState' }
        evidence: { type: array, items: { $ref: '#/components/schemas/StorageEvidence' } }
        notes: { type: array, items: { type: string } }
    StorageEdge:
      type: object
      required: [from, to, kind, evidence]
      properties:
        from: { type: string }
        to: { type: string }
        kind: { type: string, description: "Relationship. possibly-used-by is a provisional disk-to-PV candidate (confidence provisional) and is not a claim of use" }
        evidence: { $ref: '#/components/schemas/StorageEvidence' }
    StorageClaim:
      type: object
      required: [node, technology, evidence]
      properties:
        node: { type: string }
        technology: { type: string }
        evidence: { $ref: '#/components/schemas/StorageEvidence' }
    StorageLVMVolume:
      type: object
      required: [uuid, name, vg_uuid, vg_name, health, segments]
      properties:
        uuid: { type: string }
        name: { type: string }
        vg_uuid: { type: string }
        vg_name: { type: string }
        parent: { type: string, description: "lv_parent name; joined only within one VG of one report" }
        size_bytes: { type: integer, minimum: 0 }
        attributes: { type: string, description: "lv_attr; runtime characters are ? in metadata-only mode" }
        health: { type: string, description: "unknown when not reported or in metadata-only mode" }
        kernel_join: { type: string, enum: [joined, no-kernel-node, ambiguous, not-checked] }
        sync_action: { type: string }
        sync_percent: { type: number, minimum: 0, maximum: 100 }
        cache_total_blocks: { type: integer, minimum: 0 }
        cache_used_blocks: { type: integer, minimum: 0 }
        cache_dirty_blocks: { type: integer, minimum: 0 }
        origin_uuid: { type: string }
        pool_uuid: { type: string }
        data_uuid: { type: string }
        metadata_uuid: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string }
              start_bytes: { type: integer, minimum: 0 }
              size_bytes: { type: integer, minimum: 0 }
              cache_mode: { type: string }
              cache_policy: { type: string }
              devices: { type: string, description: Display evidence only, never an executable target }
              metadata_devices: { type: string }
    StorageLVMPhysicalVolume:
      type: object
      required: [uuid, missing, missing_state, ambiguous, segments]
      properties:
        uuid: { type: string }
        name: { type: string, description: "Display evidence only; never used to join or target a device" }
        vg_uuid: { type: string }
        vg_name: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        device_size_bytes: { type: integer, minimum: 0 }
        device_number: { type: string, description: "LVM pv_major:pv_minor (absent for 0:0/-1, i.e. no device). A separate observation from sysfs that only nominates a candidate disk; see device_link" }
        attributes: { type: string }
        missing: { type: boolean, description: "True only when LVM reported pv_missing" }
        missing_state: { type: string, enum: [present, missing, missing-from-attr, not-reported], description: "missing-from-attr: pv_missing absent and pv_attr bit 3 is m" }
        ambiguous: { type: boolean, description: "PV UUID reported on more than one device or flagged duplicate in pv_attr; no device association" }
        device_link: { type: string, enum: [verified, provisional, withheld, no-device], description: "verified needs a matching LVM2_member signature UUID, equal sizes and an unchanged later sysfs observation in the same boot; provisional means uncontradicted but uncorroborated; withheld means observations disagree" }
        device_link_reason: { type: string }
        segments:
          type: array
          items:
            type: object
            properties:
              start_extent: { type: integer, minimum: 0 }
              size_extents: { type: integer, minimum: 0 }
              lv_uuid: { type: string }
    StorageGraph:
      type: object
      required: [nodes, edges, claims, status, notes]
      properties:
        boot_id: { type: string, description: Observed kernel boot identifier; absent when unavailable }
        lvm:
          type: object
          required: [mode, source, volumes, physical_volumes]
          properties:
            mode: { type: string, enum: [metadata-only, live], description: "Stated by the collector; metadata-only reports carry no runtime health" }
            source: { type: string }
            volumes: { type: array, items: { $ref: '#/components/schemas/StorageLVMVolume' } }
            physical_volumes: { type: array, items: { $ref: '#/components/schemas/StorageLVMPhysicalVolume' } }
        nodes: { type: array, items: { $ref: '#/components/schemas/StorageNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/StorageEdge' } }
        claims: { type: array, items: { $ref: '#/components/schemas/StorageClaim' } }
        status: { type: string, enum: [ok, partial, unavailable] }
        notes: { type: array, items: { type: string } }
    LayoutAssignment:
      type: object
      description: "An administrator's manual statement, never verified by hardware: provenance is always manual and confidence always unverified. Keyed by a persistent identity (wwn:, nvme-uuid: or serial:), never a kernel name or device number."
      required: [identity, provenance, confidence, assigned_by, assigned_at]
      properties:
        identity: { type: string, maxLength: 512 }
        provenance: { type: string, enum: [manual] }
        confidence: { type: string, enum: [unverified] }
        assigned_by: { type: string }
        assigned_at: { type: string, format: date-time }
    LayoutCell:
      type: object
      required: [row, col, kind, label]
      properties:
        row: { type: integer, minimum: 0, maximum: 23 }
        col: { type: integer, minimum: 0, maximum: 23 }
        kind: { type: string, enum: [hdd-3.5, ssd-2.5, nvme-m2, nvme-u2, tray, empty, disabled, reserved] }
        label: { type: string, maxLength: 64 }
        assignment: { $ref: '#/components/schemas/LayoutAssignment' }
    Chassis:
      type: object
      required: [id, name, kind, rows, cols, created_at, updated_at, cells]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 64 }
        kind: { type: string, enum: [server, shelf, external, desktop] }
        rows: { type: integer, minimum: 1, maximum: 24 }
        cols: { type: integer, minimum: 1, maximum: 24 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cells: { type: array, items: { $ref: '#/components/schemas/LayoutCell' } }
    ChassisSpec:
      type: object
      additionalProperties: false
      required: [name, kind, rows, cols]
      description: Unlisted positions default to an unlabelled hdd-3.5 bay. At most 32 chassis.
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [server, shelf, external, desktop] }
        rows: { type: integer, minimum: 1, maximum: 24 }
        cols: { type: integer, minimum: 1, maximum: 24 }
        cells:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, col, kind]
            properties:
              row: { type: integer, minimum: 0, maximum: 23 }
              col: { type: integer, minimum: 0, maximum: 23 }
              kind: { type: string, enum: [hdd-3.5, ssd-2.5, nvme-m2, nvme-u2, tray, empty, disabled, reserved] }
              label: { type: string, maxLength: 64 }
    DriveLayout:
      type: object
      required: [chassis]
      description: Stored manual layout only. Bay states (present, missing, mismatch, vacant) are computed by joining persistent identities with a current /storage observation.
      properties:
        chassis: { type: array, items: { $ref: '#/components/schemas/Chassis' } }
    StorageInventory:
      type: object
      required: [collected_at, read_only, graph, snapshot_persisted]
      properties:
        collected_at: { type: string, format: date-time }
        read_only: { type: boolean, const: true }
        snapshot_persisted: { type: boolean }
        snapshot_id: { type: string, description: Historical observation ID; not authorization for a target }
        graph: { $ref: '#/components/schemas/StorageGraph' }
    Overview:
      type: object
      required: [collected_at, system, cpu, memory, filesystems, network, legacy_webmin]
      properties:
        collected_at: { type: string, format: date-time }
        system:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                hostname: { type: string }
                kernel: { type: string }
                os:
                  type: object
                  properties:
                    id: { type: string }
                    id_like: { type: string }
                    name: { type: string }
                    pretty_name: { type: string }
                    version_id: { type: string }
                distro_family: { type: string, enum: [debian, fedora, suse, arch, unknown] }
                uptime_seconds: { type: number }
                load_average: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        cpu:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                model: { type: string }
                logical_cpus: { type: integer }
                usage_percent: { type: number, description: Omitted when it could not be sampled }
                sample_millis: { type: integer }
        memory:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                total_bytes: { type: integer }
                available_bytes: { type: integer }
                used_bytes: { type: integer }
                swap_total_bytes: { type: integer }
                swap_free_bytes: { type: integer }
        filesystems:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                view:
                  type: string
                  enum: [host, service]
                  description: "host = the host's mount table (/proc/1/mounts); service = only hc-api's sandboxed view was readable, so read_only is never set and note explains."
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [kernel_source, mount_point, fs_type, read_only, probed]
                    properties:
                      kernel_source: { type: string, description: "Kernel-reported source. /dev/sdX names are volatile and are not a drive identity." }
                      mount_point: { type: string }
                      fs_type: { type: string }
                      read_only: { type: boolean, description: "Read-only on the host. Always false in the service view, where the sandbox makes every mount look read-only." }
                      probed: { type: boolean }
                      skip_reason: { type: string }
                      total_bytes: { type: integer }
                      used_bytes: { type: integer }
                      avail_bytes: { type: integer }
        network:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                interfaces:
                  type: array
                  items:
                    type: object
                    required: [name, physical, rx_bytes, tx_bytes]
                    properties:
                      name: { type: string }
                      oper_state: { type: string }
                      mac: { type: string }
                      mtu: { type: integer }
                      physical: { type: boolean }
                      speed_mbps: { type: integer }
                      rx_bytes: { type: integer }
                      tx_bytes: { type: integer }
                      addresses: { type: array, items: { type: string } }
        legacy_webmin:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                installed: { type: boolean }
                version: { type: string }
                config_readable: { type: boolean }
                configured_url: { type: string }
                privilege_needed: { type: string }
    Capability:
      type: object
      required: [id, label, path, scope, status]
      properties:
        id: { type: string, enum: [overview, services, hardware, legacy, audit, service_logs, unit_files, storage, host_settings, files] }
        label: { type: string }
        path: { type: string }
        scope: { type: string }
        status: { type: string, enum: [available, degraded, unavailable, unsupported, forbidden] }
        reason: { type: string }
    Capabilities:
      type: object
      required: [broker, capabilities]
      properties:
        broker:
          type: object
          properties:
            status: { type: string, enum: [available, unavailable] }
            version: { type: string }
            reason: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' }, description: 'Capabilities of disabled modules are omitted, so navigation hides them.' }
        modules:
          type: array
          description: 'Compiled-in modules (M2-3 registry, D-10 proposal) and whether the host administrator enabled them (root-owned /etc/homelab-control/modules.json). Routes of a disabled module answer 404 exactly like unknown routes.'
          items:
            type: object
            required: [id, title, description, path, enabled, scopes]
            properties:
              id: { type: string, enum: [services] }
              title: { type: string }
              path: { type: string, description: Page of the module in the web UI }
              description: { type: string }
              enabled: { type: boolean }
              scopes: { type: array, items: { type: string } }
              reason: { type: string }
    UnitList:
      description: Runtime units plus installed unit files. File-only entries use load not-loaded and active/sub unknown; enablement does not establish runtime state. counts are keyed by active state (including unknown) plus failed_total, over all units before truncation; truncation keeps runtime units before file-only entries. If list-unit-files fails, file-only entries are omitted.
      type: object
      required: [units, counts, truncated, source]
      properties:
        systemd_version: { type: string }
        truncated: { type: boolean }
        source: { type: string }
        counts: { type: object, additionalProperties: { type: integer } }
        units:
          type: array
          items:
            type: object
            required: [name, type, load, active, sub, description]
            properties:
              name: { type: string, pattern: '^[A-Za-z0-9:_.\\@-]{1,256}$' }
              type: { type: string }
              load: { type: string }
              active: { type: string }
              sub: { type: string }
              description: { type: string, maxLength: 256 }
              unit_file_state: { type: string }
              preset: { type: string }
        protected:
          type: object
          description: .service units the built-in policy (D-5) protects, keyed by unit name. Labels for the UI only; the broker enforces the policy.
          additionalProperties: { $ref: '#/components/schemas/Protection' }
        operate:
          type: object
          required: [available]
          properties:
            available: { type: boolean, description: 'Whether start/stop/restart can be offered to this caller' }
            reason: { type: string }
        configure:
          type: object
          required: [available]
          properties:
            available: { type: boolean, description: 'Whether boot-time enable/disable can be offered to this caller (services.configure)' }
            reason: { type: string }
    Protection:
      type: object
      required: [protected]
      properties:
        protected: { type: boolean }
        category: { type: string, enum: [self, remote, ipc, systemd, console, session, network, firewall, remoteaccess, display, storage, security, power, identity] }
        reason: { type: string }
        matched: { type: string }
    UnitObserved:
      type: object
      required: [id, load_state, active_state, sub_state]
      properties:
        id: { type: string }
        names: { type: array, items: { type: string } }
        description: { type: string }
        load_state: { type: string }
        active_state: { type: string }
        sub_state: { type: string }
        result: { type: string }
        unit_file_state: { type: string }
        main_pid: { type: integer }
        exec_main_status: { type: integer }
        invocation_id: { type: string }
        type: { type: string }
        state_since: { type: string }
    ServicePlan:
      type: object
      required: [unit, requested, action, risk, step_up_required, token, expires_at, observed, effect, consequences]
      properties:
        unit: { type: string, description: Canonical unit ID (aliases are resolved by the broker) }
        requested: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        risk: { type: string, enum: [reversible, disruptive] }
        step_up_required: { type: boolean }
        token: { type: string, description: 'Single-use plan token, valid 120 s, bound to this session, user, action, unit and the observed state. Not a credential on its own.' }
        expires_at: { type: string, format: date-time }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        effect: { type: string }
        consequences: { type: array, items: { type: string } }
        also_affected: { type: array, items: { type: string }, description: 'Running units systemd stops or restarts together with this one (found by a bounded, transitive walk of the dependency graph), or that a start stops because of Conflicts=' }
        also_started: { type: array, items: { type: string }, description: Other currently inactive units that a start pulls in (transitively) }
    ServiceOutcome:
      type: object
      required: [operation_id, unit, action, outcome, message, started_at, finished_at]
      properties:
        operation_id: { type: string }
        unit: { type: string }
        action: { type: string, enum: [start, stop, restart] }
        outcome: { type: string, enum: [succeeded, failed, uncertain], description: 'succeeded/failed are verified by reading the unit state back; uncertain means it could not be verified' }
        message: { type: string }
        exit_code: { type: integer }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        recovery: { type: array, items: { type: string }, description: Recovery guidance when the outcome is not succeeded. No rollback is performed. }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    EnablementPlan:
      type: object
      description: 'Review of a boot-time enable or disable (M2-3). Nothing is changed. Never starts or stops the unit, never reloads systemd.'
      required: [unit, requested, action, risk, step_up_required, token, expires_at, observed, boot_state, effect, consequences, links]
      properties:
        unit: { type: string, description: Canonical unit ID }
        requested: { type: string }
        action: { type: string, enum: [enable, disable] }
        risk: { type: string, enum: [disruptive], description: 'Persistent boot-time changes are disruptive: step-up is always required' }
        step_up_required: { type: boolean }
        token: { type: string, description: 'Single-use plan token (120 s) for op services.enablement; it can never authorize start/stop/restart' }
        expires_at: { type: string, format: date-time }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        boot_state: { type: string, description: '`systemctl is-enabled` (computed from disk) at review time: disabled for enable, enabled for disable' }
        preset: { type: string }
        effect: { type: string }
        consequences: { type: array, items: { type: string } }
        links: { type: array, items: { type: string }, description: 'Symbolic links under /etc/systemd/system that enable creates or disable removes' }
        wanted_by: { type: array, items: { type: string } }
        aliases: { type: array, items: { type: string } }
        also_affected: { type: array, items: { type: string }, description: 'Enable only: running units the boot-time start would stop (Conflicts=)' }
        also_started: { type: array, items: { type: string }, description: 'Enable only: inactive units the boot-time start pulls in' }
        notes: { type: array, items: { type: string } }
    EnablementOutcome:
      type: object
      required: [operation_id, unit, action, outcome, message, boot_state_before, links, started_at, finished_at]
      properties:
        operation_id: { type: string }
        unit: { type: string }
        action: { type: string, enum: [enable, disable] }
        outcome: { type: string, enum: [succeeded, failed, uncertain], description: 'succeeded only when systemctl exited 0, is-enabled reports the requested state and every expected link is in the requested state (checked by the broker itself); a partial change is failed and says so' }
        message: { type: string }
        exit_code: { type: integer }
        boot_state_before: { type: string }
        boot_state: { type: string, description: 'Absent when it could not be read back' }
        links: { type: array, items: { type: object, required: [path, present], properties: { path: { type: string }, present: { type: boolean }, target: { type: string, description: 'Where a present link points (as stored)' }, points_to_unit: { type: boolean, description: 'Whether that target is the unit file found by the review' } } } }
        unexpected_links: { type: array, items: { type: string }, description: 'Links to the unit found by a fresh scan of /etc/systemd/system afterwards that the plan did not describe; any makes the outcome not succeeded' }
        reported: { type: array, items: { type: string }, description: "systemctl's own Created symlink / Removed lines" }
        observed: { $ref: '#/components/schemas/UnitObserved' }
        recovery: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    UnitDetail:
      type: object
      description: 'What systemd reports about one unit from the inventory. Absent values are omitted, never guessed. kind template: no runtime state; alias: requested is another name of id; loaded_for_query: installed but not loaded, systemd loaded the definition only to answer.'
      required: [requested, kind, in_runtime, dependencies, source]
      properties:
        requested: { type: string }
        id: { type: string }
        kind: { type: string, enum: [unit, alias, template] }
        in_runtime: { type: boolean }
        loaded_for_query: { type: boolean }
        names: { type: array, items: { type: string } }
        description: { type: string }
        load_state: { type: string }
        active_state: { type: string }
        sub_state: { type: string }
        result: { type: string }
        unit_file_state: { type: string, description: "systemd's loaded value (may be stale after a change made without reload)" }
        boot_state: { type: string, description: 'list-unit-files state, computed from disk' }
        preset: { type: string }
        fragment_path: { type: string }
        source_path: { type: string }
        drop_in_paths: { type: array, items: { type: string } }
        generated: { type: boolean }
        transient: { type: boolean }
        need_daemon_reload: { type: boolean }
        service_type: { type: string }
        restart: { type: string }
        restarts: { type: integer, description: NRestarts (services only) }
        main_pid: { type: integer }
        last_exit: { type: object, required: [code, status, exited_at], properties: { code: { type: string, enum: [exited, killed, dumped core, unknown] }, status: { type: integer }, exited_at: { type: string }, started_at: { type: string } } }
        active_since: { type: string }
        inactive_since: { type: string }
        state_since: { type: string }
        dependencies: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'Keyed by systemd relation (Requires, Wants, WantedBy, After, Triggers, …), at most 64 names each' }
        dependencies_truncated: { type: boolean }
        notes: { type: array, items: { type: string } }
        source: { type: string }
        protected: { $ref: '#/components/schemas/Protection' }
    UnitContents:
      type: object
      required: [unit, files, redactions, truncated, source]
      properties:
        unit: { type: string }
        files: { type: array, items: { type: object, required: [path, text], properties: { path: { type: string }, text: { type: string }, unreadable: { type: boolean } } } }
        unreadable: { type: array, items: { type: string }, description: Files the service account cannot read; their content is never shown }
        redactions: { type: integer, description: "Number of lines in which values that look like secrets were replaced by [redacted] (heuristic)" }
        truncated: { type: boolean, description: 'Cut at 64 KiB or 2,000 lines' }
        notes: { type: array, items: { type: string } }
        source: { type: string }
    TimerList:
      type: object
      required: [timers, truncated, source]
      properties:
        truncated: { type: boolean }
        source: { type: string }
        timers:
          type: array
          items:
            type: object
            required: [unit, active_state]
            properties:
              unit: { type: string }
              activates: { type: string }
              description: { type: string }
              active_state: { type: string }
              sub_state: { type: string }
              unit_file_state: { type: string }
              next: { type: string, format: date-time }
              last: { type: string, format: date-time }
              schedule: { type: array, items: { type: string } }
              persistent: { type: boolean }
    SocketList:
      type: object
      required: [sockets, truncated, source]
      properties:
        truncated: { type: boolean }
        source: { type: string }
        sockets:
          type: array
          items:
            type: object
            required: [unit, listen, active_state]
            properties:
              unit: { type: string }
              description: { type: string }
              listen: { type: array, items: { type: string } }
              activates: { type: array, items: { type: string } }
              active_state: { type: string }
              sub_state: { type: string }
              unit_file_state: { type: string }
    OperationList:
      type: object
      required: [operations, source]
      properties:
        source: { type: string }
        operations:
          type: array
          items:
            type: object
            required: [id, op, action, unit, actor, risk, outcome, started_at]
            properties:
              id: { type: string }
              op: { type: string }
              action: { type: string }
              unit: { type: string }
              actor: { type: string }
              request_id: { type: string }
              risk: { type: string }
              outcome: { type: string, enum: [succeeded, failed, uncertain, interrupted, pending] }
              message: { type: string }
              started_at: { type: string, format: date-time }
              finished_at: { type: string, format: date-time }
              observed: { $ref: '#/components/schemas/UnitObserved' }
    SessionList:
      type: object
      required: [persistent, idle_timeout_seconds, max_lifetime_seconds, sessions]
      properties:
        persistent: { type: boolean, description: 'false when hc-api runs without the state database (sessions end on restart)' }
        idle_timeout_seconds: { type: integer }
        max_lifetime_seconds: { type: integer }
        sessions:
          type: array
          items:
            type: object
            required: [id, created, last_seen, current]
            properties:
              id: { type: string, description: SHA-256 of the cookie value; cannot be used to sign in }
              created: { type: string, format: date-time }
              last_seen: { type: string, format: date-time, description: 'Refreshed at most every 30 s' }
              remote_ip: { type: string }
              user_agent: { type: string }
              current: { type: boolean }
    AuditPage:
      type: object
      required: [events, source]
      properties:
        next_before: { type: integer }
        source: { type: string }
        events:
          type: array
          items:
            type: object
            required: [id, seq, time, event, outcome, prev, hash]
            properties:
              id: { type: integer }
              seq: { type: integer }
              time: { type: string, format: date-time }
              event: { type: string }
              user: { type: string }
              remote: { type: string }
              outcome: { type: string }
              detail: { type: string }
              prev: { type: string }
              hash: { type: string }
    UnitLogs:
      type: object
      required: [unit, requested, entries, truncated, source]
      properties:
        unit: { type: string }
        requested: { type: integer }
        truncated: { type: boolean, description: Older entries were dropped to stay under 1 MiB }
        skipped: { type: integer, description: Unparseable journal lines }
        source: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [message]
            properties:
              time: { type: string, format: date-time }
              priority: { type: integer, minimum: 0, maximum: 7 }
              pid: { type: integer }
              identifier: { type: string, maxLength: 64 }
              message: { type: string, maxLength: 4096, description: Control characters removed; capped at 4 KiB }
              truncated: { type: boolean }
    HostSetting:
      type: object
      description: One observed host setting. value is present only when status is observed; unavailable means unknown, never a default.
      required: [status, source]
      properties:
        value: { type: string }
        status: { type: string, enum: [observed, not-set, unavailable] }
        source: { type: string, description: File the value was read from }
        note: { type: string }
    HostSettings:
      type: object
      required: [kernel_hostname, static_hostname, pretty_hostname, timezone]
      properties:
        kernel_hostname: { $ref: '#/components/schemas/HostSetting' }
        static_hostname: { $ref: '#/components/schemas/HostSetting' }
        pretty_hostname: { $ref: '#/components/schemas/HostSetting' }
        timezone: { $ref: '#/components/schemas/HostSetting' }
    HostSettingsPreview:
      type: object
      description: A comparison of requested and observed values. Nothing was applied; preview_only is always true and executed and host_changed are always false. apply_available is true when this server's broker has host.settings.apply and hostnamectl and timedatectl.
      required: [preview_only, executed, host_changed, apply_available, notice, valid, collected_at, current, changes, warnings]
      properties:
        preview_only: { type: boolean, const: true }
        executed: { type: boolean, const: false }
        host_changed: { type: boolean, const: false }
        apply_available: { type: boolean, description: 'True when the broker has host.settings.apply, writes are available, and hostnamectl and timedatectl are on the allow-list. Preview still never applies.' }
        notice: { type: string }
        valid: { type: boolean }
        collected_at: { type: string, format: date-time }
        current: { $ref: '#/components/schemas/HostSettings' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/HostSettingChange' }
        warnings: { type: array, items: { type: string } }
    HostSettingChange:
      type: object
      required: [field, current, requested, outcome]
      properties:
        field: { type: string, enum: [static_hostname, pretty_hostname, timezone] }
        current: { type: string }
        requested: { type: string }
        outcome: { type: string, enum: [unchanged, would-change, invalid, cannot-compare] }
        reason: { type: string }
    HostSettingsObserved:
      type: object
      description: hostnamectl/timedatectl status as the broker reports it. This is not the kernel hostname seen by hc-api (ProtectHostname=yes).
      required: [static_status, pretty_status, timezone_status]
      properties:
        static_hostname: { type: string }
        static_status: { type: string, enum: [observed, not-set, unavailable] }
        pretty_hostname: { type: string }
        pretty_status: { type: string, enum: [observed, not-set, unavailable] }
        timezone: { type: string }
        timezone_status: { type: string, enum: [observed, not-set, unavailable] }
        transient_hostname: { type: string }
        transient_status: { type: string, enum: [observed, not-set, unavailable] }
        notes: { type: array, items: { type: string } }
    HostSettingsPlan:
      type: object
      description: 'Review of a hostname and/or timezone change (M2-6, ADR 0011). Nothing is changed. Risk is reversible: confirmation is required, password re-entry is not.'
      required: [action, risk, step_up_required, confirmation_required, token, expires_at, observed, effect, consequences, warnings, changes, fields]
      properties:
        action: { type: string, enum: [set] }
        risk: { type: string, enum: [reversible] }
        step_up_required: { type: boolean }
        confirmation_required: { type: boolean }
        token: { type: string, description: 'Single-use plan token, valid 120 s, bound to this session, user, action set, target host and the observed hostnamectl/timedatectl state plus the requested fields. Not a credential on its own.' }
        expires_at: { type: string, format: date-time }
        observed: { $ref: '#/components/schemas/HostSettingsObserved' }
        effect: { type: string }
        consequences: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string }, description: 'Includes the TLS, mDNS and /etc/hosts warning when the static host name would change' }
        changes: { type: array, items: { $ref: '#/components/schemas/HostSettingChange' } }
        fields: { type: array, items: { type: string, enum: [static_hostname, pretty_hostname, timezone] } }
    HostSettingsOutcome:
      type: object
      description: 'Result of host.settings.apply. succeeded means every requested field matches hostnamectl/timedatectl after the change. The kernel hostname seen by hc-api may stay at start-time (ProtectHostname=yes).'
      required: [operation_id, action, outcome, message, fields, started_at, finished_at]
      properties:
        operation_id: { type: string }
        action: { type: string, enum: [set] }
        outcome: { type: string, enum: [succeeded, failed, uncertain], description: 'succeeded/failed are verified by reading hostnamectl/timedatectl back; uncertain means it could not be verified' }
        message: { type: string }
        fields: { type: array, items: { type: string, enum: [static_hostname, pretty_hostname, timezone] } }
        observed: { $ref: '#/components/schemas/HostSettingsObserved' }
        recovery: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    Hardware:
      type: object
      required: [inventory, identity]
      description: >
        inventory comes from world-readable sysfs (hc-api); identity (SMBIOS serials/UUID) from the
        broker op hardware.dmi.identity. Disk identity is never the kernel name; identity_confidence is
        high (WWN), medium (serial), low (by-id only) or none.
      properties:
        inventory: { type: object }
        identity:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable] }
            reason: { type: string }
            data: { type: object }
    LegacyWebmin:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [broker, unprivileged] }
        reason: { type: string }
        status:
          type: object
          description: Allow-listed fields only; never hashes, keys or session data.
          properties:
            installed: { type: boolean }
            version: { type: string }
            port: { type: integer }
            tls: { type: boolean }
            bind: { type: string }
            listens_on_all_interfaces: { type: boolean }
            running: { type: boolean }
            user_count: { type: integer }
            rpc_capable_users: { type: array, items: { type: string } }
            checks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  level: { type: string, enum: [ok, warn, info] }
                  message: { type: string }
        fallback: { type: object }
    PackageList:
      type: object
      required: [packages, truncated, source]
      properties:
        truncated: { type: boolean }
        source: { type: string }
        packages:
          type: array
          items:
            type: object
            required: [name, installed]
            additionalProperties: false
            properties:
              name: { type: string }
              version: { type: string }
              arch: { type: string }
              origin: { type: string }
              installed: { type: boolean }
              upgradable: { type: boolean }
              summary: { type: string }
    UpdateList:
      type: object
      required: [updates, truncated, source]
      properties:
        truncated: { type: boolean }
        source: { type: string }
        as_of: { type: string, description: RFC3339 mtime of the local metadata cache; never a network refresh }
        updates:
          type: array
          items:
            type: object
            required: [name, new]
            additionalProperties: false
            properties:
              name: { type: string }
              arch: { type: string }
              origin: { type: string }
              current: { type: string }
              new: { type: string }
    SourceList:
      type: object
      required: [sources, truncated, source]
      properties:
        truncated: { type: boolean }
        source: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [name, origin, enabled, signed, third_party]
            additionalProperties: false
            properties:
              name: { type: string }
              origin: { type: string }
              enabled: { type: boolean }
              signed: { type: boolean }
              third_party: { type: boolean }
    TraefikResource:
      type: object
      additionalProperties: false
      required: [name, provider, status]
      properties:
        name: { type: string, maxLength: 280 }
        provider: { type: string, maxLength: 280 }
        status: { type: string, maxLength: 280 }
        rule: { type: string, maxLength: 262, description: Only sanitized single-host Host rules; absent means unknown }
        service: { type: string, maxLength: 280 }
        entrypoints: { type: array, maxItems: 32, items: { type: string, maxLength: 63 } }
        tls: { type: boolean, description: Absent means unknown rather than HTTP }
    TraefikInventory:
      type: object
      required: [schemaVersion, routers, services, middlewares]
      properties:
        schemaVersion: { const: 1 }
        routers: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/TraefikResource' } }
        services: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/TraefikResource' } }
        middlewares: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/TraefikResource' } }
    TraefikDiagnostics:
      type: object
      required: [schemaVersion, status, checks]
      properties:
        schemaVersion: { const: 1 }
        status: { enum: [available, degraded, unavailable] }
        checks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [resource, status]
            properties:
              resource: { enum: [routers, services, middlewares] }
              status: { enum: [available, unavailable] }
              count: { type: integer, minimum: 0, maximum: 5000 }
              code: { type: string }
              hint: { type: string }
    TraefikModel:
      type: object
      additionalProperties: false
      required: [name, host, port, entrypoint, protocol, upstreamScheme]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        host: { type: string, maxLength: 253, description: 'Lowercase dotted DNS hostname; each label is validated.' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        entrypoint: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
        protocol: { enum: [http, https] }
        upstreamScheme: { enum: [http, https] }
        tls:
          type: object
          additionalProperties: false
          properties:
            certificateResolver: { type: string, pattern: '^[a-z][a-z0-9-]{0,62}$' }
      allOf:
        - if:
            properties: { protocol: { const: https } }
          then: { required: [tls] }
          else: { not: { required: [tls] } }
    TraefikPreview:
      type: object
      required: [labels]
      properties:
        labels: { type: object, additionalProperties: { type: string } }
paths:
  /networking/reverse-proxy/traefik/inventory:
    get:
      summary: Read-only Traefik inventory; no configuration is applied
      x-required-scope: networking.proxy.read
      security: [{ session: [], csrf: [] }]
      description: Requires the session CSRF token on GET and POST. A present Origin must match; POST requires Origin. Requires an audit logger and configured helper. No browser-selected helper destination or helper credentials.
      responses:
        '200':
          description: Read-only response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraefikInventory' }
        '400': { description: Invalid or oversized model or unsupported query parameters }
        '401': { description: Session required }
        '403': { description: Missing permission or invalid CSRF/Origin }
        '404': { description: Networking module disabled }
        '415': { description: Expected JSON for preview }
        '502': { description: Helper unreachable or response invalid }
        '503': { description: Helper unconfigured or audit unavailable }
  /networking/reverse-proxy/traefik/diagnostics:
    get:
      summary: Read-only Traefik diagnostics; no configuration is applied
      x-required-scope: networking.proxy.read
      security: [{ session: [], csrf: [] }]
      description: Requires the session CSRF token on GET and POST. A present Origin must match; POST requires Origin. Requires an audit logger and configured helper. No browser-selected helper destination or helper credentials.
      responses:
        '200':
          description: Read-only response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraefikDiagnostics' }
        '400': { description: Invalid or oversized model or unsupported query parameters }
        '401': { description: Session required }
        '403': { description: Missing permission or invalid CSRF/Origin }
        '404': { description: Networking module disabled }
        '415': { description: Expected JSON for preview }
        '502': { description: Helper unreachable or response invalid }
        '503': { description: Helper unconfigured or audit unavailable }
  /networking/reverse-proxy/traefik/labels:
    post:
      summary: Read-only Traefik labels; no configuration is applied
      x-required-scope: networking.proxy.read
      security: [{ session: [], csrf: [] }]
      description: Requires the session CSRF token on GET and POST. A present Origin must match; POST requires Origin. Requires an audit logger and configured helper. No browser-selected helper destination or helper credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TraefikModel' }
      responses:
        '200':
          description: Read-only response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraefikPreview' }
        '400': { description: Invalid or oversized model or unsupported query parameters }
        '401': { description: Session required }
        '403': { description: Missing permission or invalid CSRF/Origin }
        '404': { description: Networking module disabled }
        '415': { description: Expected JSON for preview }
        '502': { description: Helper unreachable or response invalid }
        '503': { description: Helper unconfigured or audit unavailable }
  /networking/reverse-proxy/traefik/applications:
    get:
      summary: Read-only Compose discovery catalog (disabled by default)
      x-required-scope: docker.compose.read
      security: [{ session: [], csrf: [] }]
      description: Requires CSRF, allowed Origin when present, audit and configured Traefik integration. Default disabled. Uses an explicitly configured authenticated Unix metadata broker or an opt-in loopback development fixture. The broker is independently authorized by peer identity and service token; no raw Docker socket is granted to CORE. Source paths are never inferred from labels. Catalog does not require the Traefik helper. Discovery failures are safe 503 responses. No mutation methods exist.
      responses:
        '200': { description: Explicitly identified fixture catalog with internal TCP ports, networks and safe routing labels }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '503': { description: Discovery disabled or audit unavailable }
  /networking/reverse-proxy/traefik/compose-preview:
    post:
      summary: Validated labels and network patch proposal; never applies changes
      x-required-scope: networking.proxy.read
      security: [{ session: [], csrf: [] }]
      description: Also requires docker.compose.read. Server selects discovery metadata by serviceId; network and entrypoint must be confirmed. Requires live inventory to check conflicts. Returns blockers for unsupported provider, missing internal ports/networks and conflicting labels. No full Compose file or credentials returned; unrelated fields are preserved by key-level patch design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serviceId, network, model]
              properties:
                confirmUnverifiedPort: { type: boolean, default: false, description: Required confirmation for an explicitly supplied port when no internal TCP port is known; preview remains blocked as unverified }
                serviceId: { type: string }
                network: { type: string }
                model: { $ref: '#/components/schemas/TraefikModel' }
      responses:
        '200': { description: Backend-validated summary, existing and proposed routing labels/networks, key changes, warnings and blockers; applyAvailable is true only when a Traefik dynamic directory is configured and file-apply blockers are clear; labelApplyAvailable is true when an allowlisted Compose file matches and the Docker provider is enabled }
        '400': { description: Invalid model or unknown service/network/resolver }
        '401': { description: Session required }
        '403': { description: Missing either scope or invalid CSRF/Origin }
        '415': { description: JSON required }
        '502': { description: Inventory unavailable; conflict checks fail closed }
        '503': { description: Discovery or audit unavailable }
  /networking/reverse-proxy/traefik/file-apply:
    post:
      summary: Write CORE-generated file-provider YAML into the administrator Traefik dynamic directory
      x-required-scope: networking.proxy.apply
      security: [{ session: [], csrf: [] }]
      description: Also requires docker.compose.read and networking.proxy.read is not sufficient. The body is the same as compose-preview. CORE writes <name>.yml only; dynamic.yml is reserved. Docker labels, ACME, and Compose file edits are not applied. Preview blockers other than a disabled Docker provider reject the write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serviceId, network, model]
              properties:
                confirmUnverifiedPort: { type: boolean, default: false }
                serviceId: { type: string }
                network: { type: string }
                model: { $ref: '#/components/schemas/TraefikModel' }
      responses:
        '200': { description: wrote filename; applyAvailable true }
        '400': { description: Invalid model or unknown service/network/resolver }
        '401': { description: Session required }
        '403': { description: Missing apply or compose scope, or invalid CSRF/Origin }
        '409': { description: Preview blockers prevent the write }
        '415': { description: JSON required }
        '502': { description: Inventory unavailable }
        '503': { description: Dynamic directory, discovery, or audit unavailable }
  /networking/reverse-proxy/traefik/compose-apply:
    post:
      summary: Write Safe Traefik labels into the selected application's allowlisted Compose file
      x-required-scope: networking.proxy.apply
      security: [{ session: [], csrf: [] }]
      description: Also requires docker.compose.read. The body is the same as compose-preview. CORE patches services.<name>.labels in a compose.yaml under -compose-apply-dir. List or flow-style labels are rejected. CORE does not recreate containers or mount docker.sock. Recreate the Compose service after a successful write so Traefik's Docker provider reloads labels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serviceId, network, model]
              properties:
                confirmUnverifiedPort: { type: boolean, default: false }
                serviceId: { type: string }
                network: { type: string }
                model: { $ref: '#/components/schemas/TraefikModel' }
      responses:
        '200': { description: wrote filename, added key count, labelApplyAvailable true, recreated false }
        '400': { description: Invalid model or unknown service/network/resolver }
        '401': { description: Session required }
        '403': { description: Missing apply or compose scope, or invalid CSRF/Origin }
        '409': { description: Preview blockers, missing compose file, label conflict, or unsupported labels form }
        '415': { description: JSON required }
        '502': { description: Inventory unavailable }
        '503': { description: Compose apply directory, discovery, or audit unavailable }
  /networking/reverse-proxy/traefik/platform-preview:
    post:
      summary: Platform-native routing preview (Compose labels or Kubernetes resources); never applies changes
      x-required-scope: networking.proxy.read
      security: [{ session: [], csrf: [] }]
      description: Also requires platforms.read and the selected platform's family scope (docker.compose.read, podman.read or kubernetes.read). The platform, workload and Service are selected by server-issued references from the platform inventory; endpoints, sockets and credentials can never be supplied. The target must be a capability detected for that platform; Compose labels are never generated for Kubernetes. Requires live Traefik inventory for conflict checks. applyAvailable and deployable are always false; provider, placement, conflicts at apply time, TLS issuance and reachability are listed as not verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, target, workload, model]
              properties:
                platform: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
                target: { type: string, enum: [routing.preview.compose-labels, routing.preview.kubernetes-ingress, routing.preview.traefik-ingressroute, routing.preview.gateway-httproute] }
                workload: { type: string, maxLength: 512, description: Workload reference key from the platform inventory }
                service: { type: string, maxLength: 512, description: Kubernetes Service reference key; must be empty for Compose platforms }
                network: { type: string, description: Confirmed Traefik network (Compose platforms only) }
                routeClass: { type: string, maxLength: 128, description: Detected IngressClass or Gateway (namespace/name); empty selects the only candidate }
                confirmUnverifiedPort: { type: boolean, default: false }
                model: { $ref: '#/components/schemas/TraefikModel' }
      responses:
        '200': { description: Preview with platform identity, native workload/Service references, compose proposal or manifests, warnings, blockers and validation items; applyAvailable and deployable are false }
        '400': { description: Invalid request, unsupported target or unknown selection }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '404': { description: Unknown or unauthorized platform, or networking module disabled }
        '415': { description: JSON required }
        '502': { description: Traefik inventory unavailable; conflict checks fail closed }
        '503': { description: No registry, platform metadata or audit unavailable }
  /platforms:
    get:
      summary: Administrator-registered container platforms visible to the caller
      x-required-scope: platforms.read
      security: [{ session: [], csrf: [] }]
      description: Lists only platforms whose family scope the caller holds (docker.compose.read, podman.read, kubernetes.read). Returns kind, distribution, mode, authentication mechanism, a non-secret endpoint label and fingerprint, declared/detected/unsupported capabilities, last health and the authorization policy. Never returns socket paths, API URLs, tokens, kubeconfigs or certificates. autoSelected is set when exactly one visible platform can produce routing previews. Registrations come from startup configuration only; there is no create/update/delete API.
      responses:
        '200': { description: Visible platforms and optional auto-selection }
        '400': { description: Query parameters unsupported }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '503': { description: No platform registered or audit unavailable }
  /platforms/{id}/inventory:
    get:
      summary: Bounded, validated read-only inventory of one platform
      x-required-scope: platforms.read
      security: [{ session: [], csrf: [] }]
      description: Also requires the platform's family scope; unknown and unauthorized platforms both return 404. Every resource carries the platform ID and its native kind and identity. Inventory is validated by CORE independently of the adapter; malformed metadata fails closed. Audited per platform.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' } }
      responses:
        '200': { description: Platform view and normalized inventory (workloads, Services, networks/namespaces, routing providers, capabilities) }
        '400': { description: Query parameters unsupported }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '404': { description: Unknown or unauthorized platform }
        '503': { description: Platform metadata or audit unavailable }
  /containers/identity/profiles:
    get:
      summary: Reusable container identity and permission profiles
      x-required-scope: platforms.read
      security: [{ session: [], csrf: [] }]
      description: Lists the built-in profiles (UMASK and group roles only; never host UIDs/GIDs), the identity modes (image, inherit, custom) and the host group names treated as privileged. Requires at least one registered platform. Read-only; audited.
      responses:
        '200': { description: Profiles, modes and privileged group names }
        '400': { description: Query parameters unsupported }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '503': { description: No platform registered or audit unavailable }
  /containers/identity/preview:
    post:
      summary: Resolve and preview PUID/PGID, UMASK and supplemental groups for one platform (never applies)
      x-required-scope: platforms.read
      security: [{ session: [], csrf: [] }]
      description: Also requires the selected platform's family scope; unknown and unauthorized platforms both return 404. The plugin's runtime.container declaration states how the image accepts identity; nothing is inferred. Resolution order (lowest to highest) is image, platform defaults (administrator configuration), application, profile, per-container override; supplemental groups are replaced, never merged. Returns the effective values with their source layer, host IDs after the configured user-namespace map, Docker/Podman Compose fields or Kubernetes pod/container security contexts, volume compatibility (unverified unless trusted host metadata exists; proposals are never executed), blockers and warnings, and a comparison with platform-reported identity when a workload reference is given. Root identities, unsupported mechanisms and unacknowledged privileged groups are blocked, not rendered. applied and deployable are always false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, mode, runtime]
              properties:
                platform: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
                mode: { enum: [image, inherit, custom] }
                runtime: { type: object, description: The plugin manifest runtime.container declaration (schemas/plugin/v1.json) }
                application: { $ref: '#/components/schemas/ContainerIdentitySettings' }
                profile: { type: string, maxLength: 64 }
                override: { $ref: '#/components/schemas/ContainerIdentitySettings' }
                acknowledgePrivilegedGroups: { type: array, maxItems: 32, items: { type: integer, minimum: 0, maximum: 4294967294 } }
                workload: { type: string, maxLength: 512, description: Optional server-issued workload reference key from this platform's inventory }
      responses:
        '200': { description: Platform view, resolved identity preview and validated runtime declaration }
        '400': { description: Invalid request or runtime declaration, or unknown workload }
        '401': { description: Session required }
        '403': { description: Missing scope or invalid CSRF/Origin }
        '404': { description: Unknown or unauthorized platform }
        '415': { description: Expected application/json }
        '503': { description: No platform registered, platform metadata or audit unavailable }
  /health:
    get:
      summary: Liveness (public, no host data)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok }, api: { const: v1 } } } } } }
  /auth/login:
    post:
      summary: Create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { description: Session created; cookie set, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Malformed body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not JSON, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Throttled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/oidc:
    get:
      summary: Whether single sign-on (one administrator-configured OIDC provider) is enabled
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
  /auth/oidc/start:
    get:
      summary: 'Begin single sign-on: sets a browser-binding cookie (HttpOnly, SameSite=Lax) and redirects to the provider (authorization code + PKCE S256, state, nonce)'
      security: []
      responses:
        '303': { description: 'Redirect to the provider, or to /?login=sso_failed when the provider is unavailable' }
        '404': { description: Single sign-on is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/oidc/callback:
    get:
      summary: 'Provider redirect target. Verifies the one-use state, browser binding, code exchange and ID token, then issues the ordinary session of the explicitly bound local account. Never grants a password step-up.'
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string, maxLength: 256 } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: error, in: query, schema: { type: string }, description: Provider error; not logged or reflected }
      responses:
        '303': { description: 'Redirect to / with the session cookie set, or to /?login=sso_failed (fixed targets; no caller-supplied return URL)' }
        '404': { description: Single sign-on is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      summary: Destroy the current session
      security: [{ session: [], csrf: [] }]
      responses:
        '204': { description: Logged out }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin or CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/session:
    get:
      summary: Current session and CSRF token
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/sessions:
    get:
      summary: The caller's own sessions (persistent with the state database)
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionList' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: The state database could not be read, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/sessions/{id}/revoke:
    post:
      summary: End one of the caller's own sessions (requires Origin and X-CSRF-Token)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: 'Session id from GET /auth/sessions (SHA-256 of the cookie value)' }
      responses:
        '204': { description: 'Revoked; when it was the current session the cookie is cleared' }
        '400': { description: Malformed id, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Origin or CSRF check failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'No such session for this user (other users'' sessions are never affected)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /audit:
    get:
      summary: API audit trail, newest first (scope audit.read)
      security: [{ session: [] }]
      x-required-scope: audit.read
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: 'Return records with id below this (paging cursor: next_before)' }
        - { name: event, in: query, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }, description: 'Event name prefix, e.g. auth.' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { description: Invalid query, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: No state database, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/overview:
    get:
      summary: Read-only host overview (scope system.read)
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/settings:
    get:
      summary: Read-only host name (kernel, static, pretty) and time zone, from unprivileged file reads (M2-6 skeleton)
      security: [{ session: [] }]
      x-required-scope: system.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [collected_at, read_only, settings]
                properties:
                  collected_at: { type: string, format: date-time }
                  read_only: { type: boolean, const: true }
                  settings: { $ref: '#/components/schemas/HostSettings' }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Host settings cannot be observed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/settings/preview:
    post:
      summary: 'Preview hostname and time zone changes. Never changes the host: no plan token and no broker write. host.settings.preview never authorizes plan or apply. Omitted fields are not requested; an empty pretty_hostname previews removing it.'
      security: [{ session: [] }]
      x-required-scope: host.settings.preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                static_hostname: { type: string, maxLength: 64 }
                pretty_hostname: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 128 }
      responses:
        '200': { description: 'Preview (valid tells whether every requested value is acceptable)', content: { application/json: { schema: { $ref: '#/components/schemas/HostSettingsPreview' } } } }
        '400': { description: Invalid JSON or no field requested, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, or CSRF/Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not application/json, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Host settings cannot be observed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/settings/plan:
    post:
      summary: 'Review setting the static host name, pretty host name and/or time zone (broker op host.settings.plan): observed hostnamectl/timedatectl values, reversible risk, TLS/mDNS//etc/hosts warning and a single-use plan token. Nothing is changed. host.settings.preview never authorizes this.'
      security: [{ session: [] }]
      x-required-scope: host.settings.apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                static_hostname: { type: string, maxLength: 64 }
                pretty_hostname: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 128 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HostSettingsPlan' } } } }
        '400': { description: Invalid JSON, no field requested, invalid values, unknown time zone, or nothing would change, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope host.settings.apply, or CSRF/Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'busy: another host-settings operation is in progress', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not application/json, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker, hostnamectl/timedatectl or the operation journal unavailable, or the review could not be audited (no token issued)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /host/settings/apply:
    post:
      summary: 'Execute a reviewed hostname/timezone change with its plan token (broker op host.settings.apply). Confirmation is required; password re-entry is not (reversible). The result is verified by reading hostnamectl/timedatectl back, not the kernel hostname seen by hc-api (ProtectHostname=yes). There is no rollback.'
      security: [{ session: [] }]
      x-required-scope: host.settings.apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                static_hostname: { type: string, maxLength: 64 }
                pretty_hostname: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 128 }
                token: { type: string, description: Single-use plan token from POST /host/settings/plan }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HostSettingsOutcome' } } } }
        '400': { description: Invalid JSON, no field requested, or malformed token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope host.settings.apply, or CSRF/Origin rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'conflict: host settings changed since review; or busy', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Not application/json, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'outcome_unknown: the privileged helper did not return a result', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker or journal unavailable, or the apply could not be audited (nothing executed), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /capabilities:
    get:
      summary: What this server can show this user right now (drives navigation)
      security: [{ session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Capabilities' } } } }
        '401': { description: No session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services:
    get:
      summary: systemd units (read-only, via broker op services.systemd.list)
      security: [{ session: [] }]
      x-required-scope: services.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'Broker failure (details are not exposed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable or systemd not running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '504': { description: 'Broker operation timed out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/logs:
    get:
      summary: Recent journal entries of one listed unit (read-only, via broker op services.unit.logs). Reads are audited; content is not stored.
      security: [{ session: [] }]
      x-required-scope: services.logs
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.(service|socket|timer|mount|automount|path|target|swap)$' } }
        - { name: lines, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/UnitLogs' } } } }
        '400': { description: 'Invalid unit name or line count', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'The unit is not listed by systemd', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'Broker failure (details are not exposed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable; systemd/journald or the journal reader group missing; or the read could not be audited (audit_unavailable, no content returned)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '504': { description: 'Broker operation timed out', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/plan:
    post:
      summary: 'Review start, stop or restart of one .service unit (broker op services.unit.plan): policy check, observed state, risk class and a single-use plan token. Nothing is changed.'
      security: [{ session: [] }]
      x-required-scope: services.operate
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action], properties: { action: { type: string, enum: [start, stop, restart] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServicePlan' } } } }
        '400': { description: Invalid unit, action or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, or policy_denied (protected unit, alias or dependency; RefuseManualStart/Stop)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: systemd does not know the unit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'busy: another operation on the unit is in progress', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker or systemd unavailable, operation journal unavailable, or the review could not be audited (no token issued)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/apply:
    post:
      summary: 'Execute a reviewed operation with its plan token (broker op services.unit.apply). Stop and restart need a password re-entry within 5 minutes (step_up_required). The result is verified by reading the unit state back; there is no rollback.'
      security: [{ session: [] }]
      x-required-scope: services.operate
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action, token], properties: { action: { type: string, enum: [start, stop, restart] }, token: { type: string, maxLength: 2048 } } } } }
      responses:
        '200': { description: 'Executed; the outcome (succeeded, failed or uncertain) is the observed one', content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOutcome' } } } }
        '400': { description: Invalid unit, action, token or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, step_up_required, or policy_denied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'plan_invalid (expired, used or not bound to this request), conflict (the unit changed since the review; nothing done) or busy', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'outcome_unknown: the broker returned no result (connection lost or timed out); the operation may or may not have run', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable, the journal could not be written (nothing executed) or the request could not be audited (nothing executed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/timers:
    get:
      summary: systemd timer units with schedule, last and next run (read-only, broker op services.timers.list)
      security: [{ session: [] }]
      x-required-scope: services.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TimerList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable or systemd not running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/sockets:
    get:
      summary: systemd socket units with listen addresses (read-only, broker op services.sockets.list)
      security: [{ session: [] }]
      x-required-scope: services.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SocketList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable or systemd not running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}:
    get:
      summary: 'Unit detail (read-only, broker op services.unit.detail): identity, unit-file origin, dependencies, last exit and restart counter. The unit must be in the unit list or installed unit files.'
      security: [{ session: [] }]
      x-required-scope: services.read
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\\.(service|socket|timer|mount|automount|path|target|swap)$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } } }
        '400': { description: Invalid unit name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not in the unit inventory', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable or systemd not running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/contents:
    get:
      summary: "Read-only unit file and drop-ins (broker op services.unit.contents, `systemctl cat` as the service account): files only root can read are not shown; values that look like secrets are redacted (heuristic: this permission can disclose sensitive configuration); 64 KiB / 2,000 lines. Audited (who, which unit, never content); withheld if the audit cannot be written. Needs services.files, which no other scope implies."
      security: [{ session: [] }]
      x-required-scope: services.files
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.@-]{0,99}\\.(service|socket|timer|mount|automount|path|target|swap)$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnitContents' } } } }
        '400': { description: Invalid unit name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not in the unit inventory or no unit file', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable, systemd not running, or the read could not be audited', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/enablement/plan:
    post:
      summary: 'Review enabling or disabling one .service unit at boot (broker op services.enablement.plan). Does not start or stop it and never reloads systemd. Returns the links, consequences, risk (disruptive) and a single-use plan token. Nothing is changed.'
      security: [{ session: [] }]
      x-required-scope: services.configure
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.-]{0,99}\\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action], properties: { action: { type: string, enum: [enable, disable] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EnablementPlan' } } } }
        '400': { description: Invalid unit, action or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, or policy_denied (protected unit, alias or WantedBy target; unsupported state or [Install] construct)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: systemd does not know the unit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'busy or conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker or systemd unavailable, operation journal unavailable, or the review could not be audited', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /services/units/{unit}/enablement/apply:
    post:
      summary: 'Execute a reviewed boot-time enable/disable with its plan token (broker op services.enablement.apply): `systemctl --no-reload enable|disable`, never --now. Always needs a password re-entry within 5 minutes. Verified independently (is-enabled and the links); no rollback.'
      security: [{ session: [] }]
      x-required-scope: services.configure
      parameters:
        - { name: unit, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9:_.-]{0,99}\\.service$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action, token], properties: { action: { type: string, enum: [enable, disable] }, token: { type: string, maxLength: 2048 } } } } }
      responses:
        '200': { description: 'Executed; the outcome is the observed one', content: { application/json: { schema: { $ref: '#/components/schemas/EnablementOutcome' } } } }
        '400': { description: Invalid unit, action, token or body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing scope, CSRF/Origin rejected, step_up_required, or policy_denied', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'plan_invalid, conflict (the unit or its unit files changed; nothing done) or busy', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'outcome_unknown: no result from the broker; the change may or may not have been made', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Broker unavailable, the journal could not be written or the request could not be audited (nothing executed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/step-up:
    post:
      summary: 'Re-enter the password of the signed-in user (D-3). Valid 5 minutes for this session only; failures count toward login throttling. The password never reaches the broker or the audit log.'
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [password], properties: { password: { type: string, maxLength: 1024 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [step_up_until], properties: { step_up_until: { type: string, format: date-time } } } } } }
        '403': { description: 'invalid_credentials, or CSRF/Origin rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Throttled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /operations:
    get:
      summary: 'The 100 most recent privileged operations from the broker operation journal (op operations.journal.list), newest first, including interrupted ones'
      security: [{ session: [] }]
      x-required-scope: audit.read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OperationList' } } } }
        '403': { description: Missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker or operation journal unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /files/roots:
    get:
      summary: Allow-listed file-manager roots (identifiers only). files.read is never granted by default.
      description: >
        Inventory of confined roots from root-owned /etc/homelab-control/files.json.
        Host paths are never returned. Missing, empty or unsafe config yields browse_available false.
        Identifier-bearing GET: Origin and X-CSRF-Token are required (same bar as /storage/layout).
        Audit records root counts only.
      security: [{ session: [] }]
      x-required-scope: files.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roots, browse_available]
                properties:
                  browse_available: { type: boolean }
                  roots:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        label: { type: string }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing files.read, or Origin/CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /files/entries:
    get:
      summary: List directory entries under one confined root (metadata only; no content).
      description: >
        Relative path inside an allow-listed jail. Empty path is the jail root.
        Uses in-process os.Root and O_NOFOLLOW; hc-api does not spawn; there is no broker file op.
        Jail escapes (.., extra slashes, symlink out) are refused. Audit records root id and relative path only,
        never contents and never the host jail path. Origin and X-CSRF-Token are required.
      security: [{ session: [] }]
      x-required-scope: files.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
        - { name: root, in: query, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' } }
        - { name: path, in: query, required: false, schema: { type: string }, description: Relative path inside the jail; empty is the jail root }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [root, path, entries]
                properties:
                  root: { type: string }
                  path: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, dir, size, owner, mode, mtime]
                      additionalProperties: false
                      properties:
                        name: { type: string }
                        dir: { type: boolean }
                        size: { type: integer }
                        owner: { type: string, description: 'uid:gid; never a host path' }
                        mode: { type: string, description: 'Go FileMode.String, for example -rw-r--r--' }
                        mtime: { type: string, format: date-time }
        '400': { description: Malformed path or not a directory, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing files.read, Origin/CSRF rejected, or jail escape, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Unknown root or path, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: No browseable roots, or audit unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /packages/search:
    get:
      summary: Search the local package cache (read-only; scope packages.read).
      description: >
        Search the package-manager cache of the host's distribution family. Cache-only: never
        contacts repositories or refreshes metadata. The query is bounded and validated before it
        reaches the broker (no leading dash, no shell metacharacters, 1-64 ASCII characters).
        Audit records counts and query length only, never the query text or package lists.
        Origin and X-CSRF-Token are required.
      security: [{ session: [] }]
      x-required-scope: packages.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
        - { name: q, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9+._-]{0,63}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PackageList' } } } }
        '400': { description: Invalid query, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing packages.read, or Origin/CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker down, unsupported family, missing tool, or audit unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /packages/installed:
    get:
      summary: Installed packages of the host's distribution family (read-only; scope packages.read).
      description: >
        Installed package list from the local package database, run unprivileged with a closed argv
        template and cache-only. Never contacts repositories. Audit records counts only, never
        package lists. Origin and X-CSRF-Token are required.
      security: [{ session: [] }]
      x-required-scope: packages.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PackageList' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing packages.read, or Origin/CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker down, unsupported family, missing tool, or audit unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /packages/updates:
    get:
      summary: Pending upgrades from the local cache (read-only; scope packages.read).
      description: >
        Pending upgrade list with old and new versions from the local metadata cache, labelled with
        the cache mtime (as_of). Never contacts repositories or refreshes metadata. Audit records
        counts only, never package lists. Origin and X-CSRF-Token are required.
      security: [{ session: [] }]
      x-required-scope: packages.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateList' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing packages.read, or Origin/CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker down, unsupported family, missing cache or tool, or audit unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /packages/sources:
    get:
      summary: Configured repositories and package sources (read-only; scope packages.read).
      description: >
        Configured source view with enabled, signed and third-party flags. Read-only: never adds,
        removes or changes repositories. Audit records counts only, never source lists. Origin and
        X-CSRF-Token are required.
      security: [{ session: [] }]
      x-required-scope: packages.read
      parameters:
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SourceList' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing packages.read, or Origin/CSRF rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Broker down, unsupported family, or audit unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /storage:
    get:
      summary: Audited read-only storage metadata graph; no device or mountpoint probes
      description: Partial observations explicitly report missing signature and technology membership information. No caller-selected paths, commands or writes. A missing claim does not mean a device is unused. storage.read is never granted by default. Because each read is audited and may save a bounded snapshot, the session X-CSRF-Token header is required (a cookie alone is refused with 403 csrf_rejected, before collection, audit or save).
      security: [{ session: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      x-required-scope: storage.read
      responses:
        '200': { description: Observed inventory with provenance and limitations, content: { application/json: { schema: { $ref: '#/components/schemas/StorageInventory' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing storage.read permission or missing/invalid CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Metadata or durable access audit unavailable, or collection busy, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /storage/layout:
    get:
      summary: Stored manual drive-bay layout (M2-5 Stage A). Application state only; no collection or host access.
      description: Assignments carry stored serial/WWN identities, so each read is access-audited (counts only, never identifiers) and the layout is released only after the audit record is written. The session X-CSRF-Token header is required; a cookie alone is refused with 403 csrf_rejected before the layout is read or audited.
      security: [{ session: [] }]
      x-required-scope: storage.read
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: Session CSRF token from /auth/session }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DriveLayout' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Missing storage.read permission or missing/invalid CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: State database or durable access audit unavailable (nothing is returned when the access cannot be audited), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /storage/layout/chassis:
    post:
      summary: Create a manually labelled chassis grid (application state only; audited).
      security: [{ session: [] }]
      x-required-scope: layout.manage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChassisSpec' } } }
      responses:
        '201': { description: Created; the full layout is returned, content: { application/json: { schema: { $ref: '#/components/schemas/DriveLayout' } } } }
        '400': { description: Invalid body or limits exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing layout.manage, or Origin/CSRF rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'State database or audit unavailable, or the change could not be audited (nothing changed when the requested record fails)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /storage/layout/chassis/{id}:
    put:
      summary: Replace a chassis' name, kind, size and cells. Refused (409) when an assigned bay would leave the grid or stop being a bay.
      security: [{ session: [] }]
      x-required-scope: layout.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChassisSpec' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DriveLayout' } } } }
        '400': { description: Invalid body or limits exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: No such chassis, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Would drop or invalidate an existing assignment, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing layout.manage, or Origin/CSRF rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'State database or audit unavailable, or the change could not be audited (nothing changed when the requested record fails)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a chassis. Refused (409) while any of its bays has an assignment.
      security: [{ session: [] }]
      x-required-scope: layout.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DriveLayout' } } } }
        '404': { description: No such chassis, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Chassis still has assignments, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Missing layout.manage, or Origin/CSRF rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'State database or audit unavailable, or the change could not be audited (nothing changed when the requested record fails)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /storage/layout/chassis/{id}/bays/{row}/{col}/assignment:
    put:
      summary: "Record a manual, unverified assignment of a drive to a bay. Also requires storage.read. The drive is confirmed against a fresh observation: exactly one whole disk whose observed, unambiguous persistent identity (wwn:, nvme-uuid: or serial:) equals persistent_id. An occupied bay or an identity already assigned elsewhere is refused (409); nothing is overwritten or moved."
      security: [{ session: [] }]
      x-required-scope: layout.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: row, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 23 } }
        - { name: col, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 23 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [persistent_id], properties: { persistent_id: { type: string, maxLength: 512 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DriveLayout' } } } }
        '400': { description: Invalid body or identity tier not assignable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: No such bay, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
